name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test in Chrome and Firefox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax
        run: for f in extension/*.js extension/*/*.js scripts/*.mjs test/fixtures/*.js test/unit/*.mjs; do node --check "$f"; done

      - name: Unit tests
        run: npm run test:unit

      - name: Build store packages
        run: npm run build

      - name: Chrome end-to-end, on the store ZIP itself
        run: |
          unzip -q dist/cookie-policy-rejector-chrome-*.zip -d "$RUNNER_TEMP/chrome-zip"
          CPR_EXTENSION="$RUNNER_TEMP/chrome-zip" npm run test:chrome

      - name: Firefox end-to-end
        run: node scripts/firefox-e2e.mjs

      - name: Keep store packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: test/output/
          if-no-files-found: ignore
